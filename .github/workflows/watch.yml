name: Roll Watch

# 设计要点：不再指望 GitHub 的定时器准点。
# 一次 job 启动后自己连续盯 345 分钟，内部每 5 分钟检查一轮，
# 所以一天只需要 cron 触发两次（盘中一次、夜盘一次）。
# 就算 GitHub 把大部分触发都跳掉，也不影响覆盖。
#
# 定时按 UTC 写，对应北京时间：
#   01:15 UTC = 09:15 北京 → 最多跑到 14:55，覆盖上午盘 + 下午盘
#   12:55 UTC = 20:55 北京 → 夜盘 23:05 收盘自动收工
on:
  schedule:
    - cron: '15 1 * * 1-5'
    - cron: '55 12 * * 1-5'
  workflow_dispatch:
    inputs:
      minutes:
        description: '连续盯多少分钟（默认 350，填 1 只跑一轮做测试）'
        required: false
        default: '350'

permissions:
  contents: write

# 上一轮没跑完时不要叠加：同一时间只留一个监听进程
concurrency:
  group: roll-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # GitHub 单 job 硬上限 6 小时，留 15 分钟余量给 checkout / setup / commit
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 连续盯盘并推送
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          SANDBOX_URL: ${{ secrets.SANDBOX_URL }}
          SANDBOX_KEY: ${{ secrets.SANDBOX_KEY }}
          LOOP_MINUTES: ${{ github.event.inputs.minutes || '350' }}
        run: node watch.js

      - name: 提交配置与冷却状态
        if: always()
        continue-on-error: true
        run: |
          git config user.name "roll-watch-bot"
          git config user.email "roll-watch-bot@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "state: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
            # 两次运行可能前后脚提交，先对齐远程再推；冲突时保留本地（冷却状态更重要）
            git fetch -q origin master || true
            git pull --rebase -X theirs origin master || git rebase --abort || true
            git push || echo "状态回写失败，不影响监听"
          fi
